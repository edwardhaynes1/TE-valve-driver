# Runs the test suite on GitHub after every push, on Windows like the lab PC.
# Results: the repository's "Actions" tab. GitHub emails you if a run fails.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:        # "Run workflow" button in the Actions tab

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The hardware libraries (LabJackPython, keller-protocol) are not needed:
      # the tests use a fake LabJack and never talk to the Keller.
      - name: Install test dependencies
        run: python -m pip install pytest pyserial numpy pandas matplotlib
      - name: Run tests
        run: python -m pytest
